name: CI

on:
  push:
    branches: [Main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Worker + dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Install npm (version from package.json packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rehearsal:
    name: Browser tests and full rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Install npm (version from package.json packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: npm ci
      - name: Install the latest stable Google Chrome, and Firefox
        run: npx playwright install --with-deps chrome firefox
      # CI machines have no Claude Code logs, so the rehearsal generates some.
      - run: npm run rehearsal
      - name: Dashboard tests in Chrome and Firefox
        run: npm run test:browser
      # Last, as it leaves files owned by root: real accounts, ccusage run as each.
      - name: Every account on a computer (the rehearsal as root)
        working-directory: e2e
        run: sudo env "PATH=$PATH" "HOME=$HOME" npx playwright test --project=rehearsal -g "creates the dashboard|admin logs in|every account"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: e2e/test-results/
          if-no-files-found: ignore

  all-users-windows:
    name: Every account on a computer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Install npm (version from package.json packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: npm ci
      - run: npm run build -w dashboard
      - name: Build ccunified, with the pinned ccusage beside it
        working-directory: agent
        shell: bash
        run: |
          go run ./tools/fetchccusage
          mkdir -p ../all-users-bin
          go build -o ../all-users-bin/ccunified.exe ./cmd/ccunified
          cp internal/ccusage/bin/windows-amd64/ccusage.exe ../all-users-bin/
      # The runner's account is an administrator; the scheduled task runs as SYSTEM.
      - name: Set up every account, and let the SYSTEM task upload
        run: node e2e/windows-all-users.mjs all-users-bin

  agent:
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Fetch the pinned ccusage (verified against pinned checksums)
        run: go run ./tools/fetchccusage
      - run: go test ./...
        env:
          CCUNIFIED_REQUIRE_CCUSAGE: "1"

  govulncheck:
    name: Known vulnerabilities in the Go program
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Checks the Go version from go.mod too (its standard library).
      - run: govulncheck ./...

  scheduler:
    name: Background schedule (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go run ./tools/fetchccusage
      - name: Start a systemd user session, as lingering does on a real machine
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            XDG_RUNTIME_DIR="$runtime_dir" systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime_dir" systemctl --user is-system-running || true
      - name: Install, trigger and remove the real scheduled sync
        run: go test ./internal/schedule/ -run Integration -v -count=1
        env:
          CCUNIFIED_TEST_SCHEDULER: "1"

  installers:
    name: Installer scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: Parse install.ps1 (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $check = '$errs = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errs) | Out-Null; if ($errs) { $errs | Format-List; exit 1 }'
          powershell.exe -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -Command $check
